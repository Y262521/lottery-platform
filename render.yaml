# Render Blueprint — direct-purchase lottery platform backend.
# Connect this repo on Render: New → Blueprint → select this repo.
# Render reads this file and provisions the web service automatically.
# After deploy, set DATABASE_URL, CORS_ORIGINS, and the optional service
# keys (Cloudinary, Chapa, Telebirr, Resend) in the Environment tab.

services:
  - type: web
    name: lottery-platform
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true          # Render generates a random value once
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── Database ─────────────────────────────────────────────────────────────
      # REQUIRED: paste your Neon (or other Postgres) connection string.
      # postgresql://user:pass@ep-xxx.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ── CORS ──────────────────────────────────────────────────────────────────
      # Set to your Vercel frontend URL after deploying the frontend.
      # e.g. https://lottery-platform-lilac.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # ── Admin seed account ────────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        value: admin@lottery-platform.com
      - key: ADMIN_PASSWORD
        sync: false                  # set a real password in the Render dashboard

      # ── App URL (used in payment return URLs) ─────────────────────────────────
      # Set to your Vercel frontend URL.
      - key: FRONTEND_URL
        sync: false

      # ── Cloudinary (images + video) ───────────────────────────────────────────
      # Get free credentials at cloudinary.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Chapa payment gateway ─────────────────────────────────────────────────
      # Get API keys at dashboard.chapa.co
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1

      # ── Telebirr payment gateway ──────────────────────────────────────────────
      - key: TELEBIRR_APP_ID
        sync: false
      - key: TELEBIRR_APP_KEY
        sync: false
      - key: TELEBIRR_SHORT_CODE
        sync: false

      # ── Resend (email notifications) ──────────────────────────────────────────
      # Get free API key at resend.com (3,000 emails/month free)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@lottery-platform.com
